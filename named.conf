options {
		directory       "/var/named";
		pid-file        "/run/named/named.pid";
		listen-on       { any; };
		listen-on-v6    { any; };
		recursion       no;
		allow-transfer  { none; };
		// ns-he.nono.io is ::2 (Hetzner configures ::1); ns-vultr only
		// accepts NOTIFYs from, and transfers to, ::2.
		notify-source-v6   2a01:4f8:c17:b8f::2;
		transfer-source-v6 2a01:4f8:c17:b8f::2;
};

// ns-vultr.nono.io
acl secondaries {
		158.247.194.13;
		2401:c080:1c00:29d6::;
};

zone "nono.io" {
		type primary;
		file "nono.io";
		allow-transfer { secondaries; };
		also-notify { 158.247.194.13; 2401:c080:1c00:29d6::; };
};

// /var/named/slaves is where Fedora's SELinux policy lets named write
zone "stepnet.com" {
		type secondary;
		file "slaves/stepnet.com";
		primaries { 209.148.105.43; };
};
